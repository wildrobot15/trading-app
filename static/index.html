<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groww Intraday Analyzer</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Groww Intraday BUY/SELL Analyzer</h1>
      <div class="controls">
        <input id="apiKey" type="password" placeholder="Enter Groww API key (daily)" />
        <input id="symbol" type="text" placeholder="Stock Symbol (e.g., RELIANCE)" value="RELIANCE" />
        <select id="timeframe">
          <option value="1m">1m</option>
          <option value="5m" selected>5m</option>
          <option value="15m">15m</option>
        </select>
        <select id="mode">
          <option value="conservative" selected>Conservative</option>
          <option value="aggressive">Aggressive</option>
        </select>
        <button id="setKey">Save API Key</button>
        <button id="analyze">Analyze</button>
      </div>
      <p id="status"></p>
      <div id="result" class="result"></div>
      <div id="chart"></div>
      <h3>Recent Analysis History</h3>
      <ul id="history"></ul>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
